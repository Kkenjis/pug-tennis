name: claude-reply

# Issue に「@claude」があると、Claude が内容を読んでコメントで返信する
#   ・起動できるのは書き込み権限のある人（持ち主・共同編集者）だけ
#   ・できるのは「リポジトリを読む」「Issue にコメントする」だけ。コードの変更・プッシュはできない
#   ・変更は今までどおり、人がプルリクエストを作り、チェックを通してからマージする
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-reply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reply:
    # Issue だけが対象（プルリクエストへのコメントでは動かない）
    if: >-
      !github.event.issue.pull_request && (
        (github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # 読むだけ
      issues: write    # コメントするため
      actions: read    # 今日の返信回数を数えるため
    env:
      # 返信の上限（チーム全体・日本時間 0 時にリセット）。メイン開発者の Claude Pro の利用枠を守るため
      DAILY_LIMIT: 10
    steps:
      - name: 今日の返信回数を確認
        id: quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d "$(TZ=Asia/Tokyo date +%F) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          # 実際に動いた回（成功・失敗・実行中）を数える。条件に合わず動かなかった回（skipped）は数えない。この回も含む
          used=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/claude-reply.yml/runs" \
            -f created=">=${since}" -f per_page=100 \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')
          echo "今日の返信（この回を含む）: ${used} / 上限 ${DAILY_LIMIT}"
          if [ "${used}" -gt "${DAILY_LIMIT}" ]; then echo "over=true" >> "$GITHUB_OUTPUT"; else echo "over=false" >> "$GITHUB_OUTPUT"; fi
      - name: 上限に達したことを知らせる
        if: steps.quota.outputs.over == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "本日の自動返信の上限（${DAILY_LIMIT} 回）に達したため、返信しませんでした。日本時間の 0 時以降に、もう一度 \`@claude\` を入れてコメントしてください。急ぎの場合はメイン開発者に連絡してください。"
      - if: steps.quota.outputs.over != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.quota.outputs.over != 'true'
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          # 鍵は GitHub の Secrets に保存（リポジトリには書かない）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリではなく、このジョブ専用の権限（上の permissions）だけを持つトークンを使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 公開リポジトリのため、Claude に渡すコメントはチームの人のものだけにする（担当が増えたら追加）
          include_comments_by_actor: "Kkenjis,TairaYuno"
          claude_args: |
            --max-turns 10
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
